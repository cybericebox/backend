name: Test

# The tests of the repository: the PR check and the pre-release run them (workflow_call).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned tools (mise.toml)
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Build
        run: mise run build
      - name: Lint
        run: mise run lint
      # No Docker Hub login: the test image comes from mirror.gcr.io, and Ryuk (the testcontainers reaper, a Docker Hub image) is
      # not needed on a runner that is thrown away after the job.
      - name: Test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: mise run test
