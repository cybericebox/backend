name: Check

# A PR into develop or into a release line (release/X.Y): tests plus the image build. Nothing is published and nothing is written to a
# registry: a check runs the code of the pull request, so it holds no Docker Hub credential at all (those are secrets of the environments
# "candidate", "release" and "build") and pulls public images anonymously. It reads the layer cache that the candidate builds write
# (cybericebox/backend:buildcache-release, public).
# Into a line, go.mod must pin a laboratory release (job "Laboratory pin"): the line becomes a candidate, and a candidate needs one.
# main takes only the pull requests of Promote, which have their own gate (main-gate.yml, "Main gate"). The required check here is "Check passed".
# It must come from a pull_request run: a check of a workflow_dispatch run is not evaluated for a pull request, so there is no dispatch trigger.
on:
  pull_request:
    # edited: a pull request that is moved from develop to a line (a new base) has to be checked again against the line
    types: [ opened, synchronize, reopened, edited ]
    branches: [ develop, 'release/*' ]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A PR with only docs (*.md, docs/**, .gitignore, LICENSE) builds nothing.
      # This is a job, not a paths-ignore on the workflow: the required check "Check passed" must always report.
      - name: Is there more than docs
        id: c
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=false
          if ! files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            code=true
          else
            while IFS= read -r f; do
              case "$f" in
                '' | *.md | docs/* | .gitignore | LICENSE) ;;
                *) code=true ;;
              esac
            done <<<"$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/test.yml

  lab-pin:
    name: Laboratory pin
    needs: changes
    if: needs.changes.outputs.code == 'true' && startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pull request into a release line (it becomes a candidate) needs a laboratory release or candidate in go.mod, not a commit or a branch.
      # Promote needs a final laboratory release (promote.yml).
      - name: Laboratory is pinned to a release or a candidate
        run: .github/scripts/lab-pin.sh require-candidate

  image:
    name: Image ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: cybericebox/backend
    steps:
      - name: Check repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Laboratory pin
        id: lab
        run: |
          echo "version=$(.github/scripts/lab-pin.sh version)" >> "$GITHUB_OUTPUT"
          echo "source=$(.github/scripts/lab-pin.sh contract-source)" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            LABORATORY_VERSION=${{ steps.lab.outputs.version }}
            LABORATORY_CONTRACT_SOURCE=${{ steps.lab.outputs.source }}
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-release

  passed:
    name: Check passed
    if: ${{ always() }}
    needs: [changes, test, image, lab-pin]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
