# gitleaks: the secret scan of `mise run lint:leaks` over the whole history. The default rules, minus what is not a secret here.
[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures (fake keys and tokens) and the self-signed localhost certificate of the 2025 manifests"
paths = ['''_test\.go$''', '''^internal/testhelpers/''', '''^deploy/manifests/certificates\.yaml$''']
